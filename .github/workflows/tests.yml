name: Tests

on:
  push:
    branches: [master]
    # Docs-only changes don't affect the driver, so skip the (expensive, live-
    # Oracle) runs when nothing outside these paths changed. A commit that also
    # touches code still runs — the filter only skips when every changed file
    # matches.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSES/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSES/**'

# Cancel a superseded run when a new commit is pushed to the same ref, so rapid
# pushes don't stack up and exhaust the Actions concurrency/usage budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline build + unit tests, once plainly and once under ASan/UBSan. Needs no
  # database: the live meson tests self-gate (exit 77 = skip) without SEER_TEST_*,
  # so `meson test` here exercises only the offline protocol-core + ODBC-shim unit
  # tests. The sanitizer leg brings the previously-manual `build-asan` run into CI.
  build:
    name: Build + unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            sanitize: none
          - name: asan+ubsan
            sanitize: address,undefined
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config libssl-dev unixodbc-dev
      - name: Configure
        run: meson setup build -Db_sanitize=${{ matrix.sanitize }}
      - name: Compile
        run: meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs

  # Offline build + unit tests on macOS. This is the real validator for the
  # ld64 symbol-export path (seerodbc.exp / -exported_symbols_list) since it can
  # only be exercised on Apple's linker. Homebrew's OpenSSL 3 is keg-only, and
  # the ODBC Driver Manager headers/libs (sql.h, libodbc) live under the brew
  # prefix, so both are wired in via PKG_CONFIG_PATH / CPPFLAGS / LDFLAGS. No
  # Oracle here: the live meson tests self-gate (exit 77) without SEER_TEST_*.
  build-macos:
    name: Build + unit (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: brew install meson ninja pkg-config openssl@3 unixodbc
      - name: Wire Homebrew keg paths into the toolchain
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix unixodbc)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix unixodbc)/lib" >> "$GITHUB_ENV"
      - name: Configure
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs
      - name: Homebrew formula (from this tree's source tarball)
        # packaging/homebrew/seerodbc.rb builds a release tag's tarball; here it
        # is pointed at a `meson dist` tarball of the PR's own tree instead, and
        # installed and tested from a throwaway local tap (Homebrew installs
        # formulae from taps only).
        run: |
          meson dist -C build --no-tests --allow-dirty
          tarball="$PWD/$(ls build/meson-dist/*.tar.xz)"
          sha=$(shasum -a 256 "$tarball" | cut -d' ' -f1)
          brew tap-new --no-git seerodbc-ci/local
          tapdir="$(brew --repository)/Library/Taps/seerodbc-ci/homebrew-local/Formula"
          sed -e "s|^  url .*|  url \"file://${tarball}\"|" \
              -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
              packaging/homebrew/seerodbc.rb > "$tapdir/seerodbc.rb"
          brew install --build-from-source seerodbc-ci/local/seerodbc
          brew test seerodbc-ci/local/seerodbc

  # Offline build + unit tests on Windows via the MSYS2 / MinGW-w64 toolchain.
  # The protocol core compiles against Winsock through src/common/netcompat.h (the
  # sockets shim), and the offline unit tests run exactly as on the other
  # platforms - the live meson tests self-gate (exit 77) without SEER_TEST_*, so
  # no Oracle is needed here. MinGW is the initial Windows target (the fastest
  # path to a green Windows CI); an MSVC leg comes later. The ODBC shim + live
  # integration land in subsequent phases of the port.
  build-windows:
    # 64-bit, and 32-bit for 32-bit applications: on Windows a driver's bitness
    # must match the application's, not the system's (#62).
    name: Build + unit (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows/MinGW
            msystem: MINGW64
            pkg: mingw-w64-x86_64
            arch: x64
          - name: Windows/MinGW 32-bit
            msystem: MINGW32
            pkg: mingw-w64-i686
            arch: x86
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg }}-gcc
            ${{ matrix.pkg }}-meson
            ${{ matrix.pkg }}-ninja
            ${{ matrix.pkg }}-pkgconf
            ${{ matrix.pkg }}-openssl
            ${{ matrix.pkg }}-libiconv
            zip
      - name: Configure
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs
      # The ODBC Driver Manager looks the entry points up by their plain names
      # (SQLConnect); a 32-bit __stdcall build must not export them decorated
      # (_SQLConnect@28).
      - name: Check the DLL's exports
        run: |
          objdump -p build/src/odbc/seerodbc.dll |
            sed -n '/\[Ordinal\/Name Pointer\] Table/,/^$/p' > exports.txt
          n=$(grep -c ' SQL' exports.txt)
          bad=$(grep -E ' _?SQL[A-Za-z]*@[0-9]+' exports.txt || true)
          echo "$n SQL exports"
          if [ "$n" -lt 60 ] || [ -n "$bad" ]; then
            echo "::error::unexpected exports: $n SQL names, decorated: $bad"
            cat exports.txt
            exit 1
          fi
          # Microsoft's Driver Manager calls the W form of every function a
          # Unicode driver exports, with no ANSI fallback: each export that
          # has a W form in ODBC (sqlucode.h) needs its W export too.
          missing=
          for f in BrowseConnect ColAttribute ColAttributes ColumnPrivileges Columns \
                   Connect DescribeCol DriverConnect Error ExecDirect ForeignKeys \
                   GetConnectAttr GetConnectOption GetCursorName GetDescField GetDescRec \
                   GetDiagField GetDiagRec GetInfo GetStmtAttr GetTypeInfo NativeSql \
                   Prepare PrimaryKeys ProcedureColumns Procedures SetConnectAttr \
                   SetConnectOption SetCursorName SetDescField SetStmtAttr SpecialColumns \
                   Statistics TablePrivileges Tables; do
            if grep -qE " SQL$f\$" exports.txt && ! grep -qE " SQL${f}W\$" exports.txt; then
              missing="$missing SQL${f}W"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::exported without their W form:$missing"
            exit 1
          fi
      # selftest.ps1 can only run on a Windows machine with a server to reach,
      # but its syntax is checked here, by PowerShell's own parser.
      - name: Parse selftest.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/packaging/windows/selftest.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'selftest.ps1 parses'
      # The release zip, as release.yml builds it, so a change that breaks the
      # packaging shows here and every PR has a zip to try on Windows.
      - name: Package the Windows zip
        run: packaging/windows/make-zip.sh build dist
      - name: Upload the Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: seerodbc-windows-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 14

  # Integration tests against a real database server, run across the three public
  # tiers via redistributable gvenzl images: 11g (:1521/XE), 21c (:1521/XEPDB1)
  # and 23ai Free (:1521/FREEPDB1). (10g and 9i can't ship to public CI — 10g's
  # image isn't redistributable and 9i needs an old kernel/glibc — so they stay
  # local, driven by tests/odbc/run-matrix.sh.) fail-fast is off so a flake on one
  # DB doesn't cancel the others; a generous --shm-size keeps the memory-fragile
  # 21c/23ai containers from OOM-stalling under the suite.
  integration:
    name: Integration (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: "XE 11g"
            image: "gvenzl/oracle-xe:11-slim"
            service: "XE"
          - name: "XE 21c"
            image: "gvenzl/oracle-xe:21-slim"
            service: "XEPDB1"
          - name: "23ai Free"
            image: "gvenzl/oracle-free:23-slim"
            service: "FREEPDB1"
    services:
      oracle:
        image: ${{ matrix.db.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: pyo
          APP_USER_PASSWORD: pyo123
        ports:
          - 1521:1521
        # The gvenzl image ships healthcheck.sh; wait for first-boot setup
        # (slower on 21c) before the test step. --shm-size gives the 21c/23ai
        # instances enough shared memory to run the full suite without OOM.
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 90s
          --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config libssl-dev unixodbc-dev
      - name: Build the driver + tests
        run: |
          meson setup build
          meson compile -C build
      # The driver .so path is baked into test_integration (-DSEER_DRIVER_PATH),
      # so the Driver Manager loads it by absolute path from the DRIVER= connect
      # string — no odbcinst.ini registration needed. The four live tests activate
      # once SEER_TEST_* is set; DBA-only features (proxy auth, DRCP) self-skip
      # because the pyo app user isn't privileged.
      - name: Run integration suite against ${{ matrix.db.name }}
        env:
          # 127.0.0.1, not "localhost" — the DM/driver connects over IPv4 and a
          # localhost->::1 resolution would miss the IPv4-published service port.
          SEER_TEST_HOST: 127.0.0.1
          SEER_TEST_PORT: "1521"
          SEER_TEST_SERVICE: ${{ matrix.db.service }}
          SEER_TEST_USER: pyo
          SEER_TEST_PASS: pyo123
        run: |
          meson test -C build --print-errorlogs \
            'odbc integration' \
            'two-phase commit (live)' \
            'object bind (live)' \
            'advanced queuing (live)' \
            'request boundaries (live)' \
            'sessionless transactions (live)' \
            'request pipelining (live)'
