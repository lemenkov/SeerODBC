name: Format Check with clang-format

on:
  pull_request:
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'include/**/*.h'
      - 'tests/**/*.c'
      - 'tests/**/*.h'
      - 'tools/**/*.c'
      - 'tools/**/*.h'
      - '.clang-format'
      - '.github/workflows/format-check.yml'

jobs:
  format:
    name: Check Clang format compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clang Format Github Action
        uses: RafikFarhad/clang-format-github-action@v7
        with:
          # The action defaults to style=LLVM, which silently ignores the
          # repository's .clang-format; `file` makes clang-format use it.
          style: file
          sources: "src/**/*.c,src/**/*.h,include/**/*.h,tests/**/*.c,tests/**/*.h,tools/**/*.c,tools/**/*.h"
